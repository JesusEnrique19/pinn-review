[project]
name = "pinnreview"
version = "0.1.0"
description = "Reproducible pipeline for a bibliometric mapping, evidence-quality audit and controlled re-evaluation of PINNs and neural operators"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "requests>=2.32",
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "python-docx>=1.2.0",
]

[project.optional-dependencies]
# Phase 2: bibliometric and network analysis
biblio = [
    "python-igraph>=0.11",
    "leidenalg>=0.10",
    "networkx>=3.3",
    "powerlaw>=1.5",
]
# Phase 4: controlled re-evaluation (CPU wheels by default)
bench = [
    "torch>=2.4",
    "hydra-core>=1.3",
]
embed = [
    "scikit-learn>=1.5",
    "sentence-transformers>=3.0",
]
fulltext = [
    "pymupdf>=1.24",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pinnreview"]

[tool.pytest.ini_options]
testpaths = ["tests"]
